# Configuración del puerto del servidor backend en Java
server.port=8080

# Conexión a tu base de datos PostgreSQL (cambia 'tu_usuario', 'tu_password' y 'omnilogix_db' por los tuyos)
spring.datasource.url=jdbc:postgresql://localhost:5432/omnilogix_db
spring.datasource.username=postgres
spring.datasource.password=tu_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate para que cree/actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect